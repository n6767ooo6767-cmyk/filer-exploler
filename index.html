<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Файловый обозреватель</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .hint {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #status {
      margin: 20px 0;
      font-weight: 600;
    }

    #files {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 20px #0001;
    }

    .folder {
      font-weight: bold;
      margin-top: 8px;
    }

    .file {
      margin: 5px 0;
      padding: 4px 0;
    }

    .indent {
      margin-left: 25px;
    }

    .size {
      color: #888;
      font-size: 13px;
      margin-left: 8px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <h1>📂 Файловый обозреватель</h1>

  <div class="hint">
    Выбери папку, например флешку <b>NIKON</b>.
    Сайт покажет её содержимое.
  </div>

  <button id="choose">Выбрать папку</button>

  <div id="status"></div>

  <div id="files">
    Пока ничего не выбрано.
  </div>

  <script>
    const chooseButton = document.getElementById("choose");
    const status = document.getElementById("status");
    const filesDiv = document.getElementById("files");

    chooseButton.addEventListener("click", async () => {
      try {
        const directoryHandle = await window.showDirectoryPicker();

        status.textContent = "📂 Папка: " + directoryHandle.name;
        filesDiv.innerHTML = "";

        await readDirectory(directoryHandle, filesDiv);

      } catch (error) {
        if (error.name === "AbortError") {
          status.textContent = "Выбор отменён.";
        } else {
          console.error(error);
          status.innerHTML =
            '<span class="error">Ошибка: ' +
            escapeHTML(error.message) +
            "</span>";
        }
      }
    });

    async function readDirectory(directoryHandle, container) {

      const entries = [];

      for await (const entry of directoryHandle.values()) {
        entries.push(entry);
      }

      entries.sort((a, b) => {
        if (a.kind !== b.kind) {
          return a.kind === "directory" ? -1 : 1;
        }

        return a.name.localeCompare(b.name, undefined, {
          numeric: true,
          sensitivity: "base"
        });
      });

      for (const entry of entries) {

        if (entry.kind === "directory") {

          const folder = document.createElement("div");
          folder.className = "folder";

          folder.textContent = "📁 " + entry.name;

          container.appendChild(folder);

          const inside = document.createElement("div");
          inside.className = "indent";

          container.appendChild(inside);

          await readDirectory(entry, inside);

        } else {

          const file = document.createElement("div");
          file.className = "file";

          let sizeText = "";

          try {
            const fileObject = await entry.getFile();
            sizeText = formatSize(fileObject.size);
          } catch {}

          file.innerHTML =
            "📄 " +
            escapeHTML(entry.name) +
            '<span class="size">' +
            sizeText +
            "</span>";

          container.appendChild(file);
        }
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " Б";
      if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " КБ";
      if (bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(1) + " МБ";

      return (bytes / 1024 / 1024 / 1024).toFixed(1) + " ГБ";
    }

    function escapeHTML(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
