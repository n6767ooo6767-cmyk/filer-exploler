<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обозреватель NIKON</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      margin: 0;
      padding: 30px;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .hint {
      color: #666;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #007aff;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .button:hover {
      opacity: 0.85;
    }

    #folderInput {
      display: none;
    }

    #status {
      margin: 20px 0;
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    #files {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #0001;
    }

    .folder {
      font-weight: 600;
      margin-top: 8px;
    }

    .file {
      margin: 5px 0;
      padding-left: 20px;
    }

    .size {
      color: #888;
      font-size: 13px;
      margin-left: 8px;
    }

    .empty {
      color: #777;
    }
  </style>
</head>

<body>

<main>

  <h1>📂 Обозреватель файлов</h1>

  <div class="hint">
    Выбери папку или накопитель NIKON.
    Сайт ничего не записывает на него.
  </div>

  <label class="button">
    📁 Выбрать NIKON
    <input
      id="folderInput"
      type="file"
      webkitdirectory
      multiple
    >
  </label>

  <div id="status">
    Накопитель не выбран.
  </div>

  <div id="files">
    <div class="empty">
      Здесь появятся файлы.
    </div>
  </div>

</main>

<script>

const input = document.getElementById("folderInput");
const status = document.getElementById("status");
const files = document.getElementById("files");

input.addEventListener("change", () => {

  const selectedFiles = Array.from(input.files);

  if (selectedFiles.length === 0) {
    status.textContent = "Ничего не выбрано.";
    return;
  }

  files.innerHTML = "";

  const firstPath =
    selectedFiles[0].webkitRelativePath;

  const rootName =
    firstPath.split("/")[0];

  status.textContent =
    "📂 " +
    rootName +
    " — найдено файлов: " +
    selectedFiles.length;

  selectedFiles.sort((a, b) =>
    a.webkitRelativePath.localeCompare(
      b.webkitRelativePath,
      undefined,
      {
        numeric: true,
        sensitivity: "base"
      }
    )
  );

  for (const file of selectedFiles) {

    const row =
      document.createElement("div");

    row.className = "file";

    row.textContent =
      "📄 " +
      file.webkitRelativePath;

    const size =
      document.createElement("span");

    size.className = "size";

    size.textContent =
      formatSize(file.size);

    row.appendChild(size);

    files.appendChild(row);
  }

});


function formatSize(bytes) {

  if (bytes < 1024)
    return bytes + " Б";

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " КБ";

  if (bytes < 1024 * 1024 * 1024)
    return (bytes / 1024 / 1024).toFixed(1) + " МБ";

  return (bytes / 1024 / 1024 / 1024).toFixed(1) + " ГБ";
}

</script>

</body>
</html>
